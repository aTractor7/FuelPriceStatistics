#spring.profiles.active=dev

bot.name = FuelStatisticsBot
bot.token = ${BOT_TOKEN}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${JDBC_DATABASE_HOST}:${JDBC_DATABASE_PORT}/${JDBC_DATABASE_NAME}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

fuel.inf.url = https://index.minfin.com.ua/markets/fuel/%s/
fuel.file.pass =${FILES_DIR:./file/FuelStatistics%d.docx}
fuel.dates.file.pass =${FILES_DIR:./file/file/FuelDates.docx}

telegram.file.url.inf = https://api.telegram.org/bot%s/getFile?file_id=%s
telegram.file.url.download = https://api.telegram.org/file/bot%s/%s

date.format = dd.MM.yyyy

